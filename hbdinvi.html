<div class="main">
    <p style="font-family: courier; font-size: 20px; font-weigt: bold; text-align: center;">Niniejszym zapraszam Cię na imprezę z okazji moich 18. urodzin.<br>Spotkanie odbędzie się [].
      <br>Reszta informacji takich jak miejsce spotkania i godzina zostaną podane w bliższym terminie.<br>~Wiktor.<br>P.S. Wypełnij poniższy formularz, żebym wiedział, że będziesz.</p>
    <br>

<button style="padding:15px;" onclick="window.location.href=''">formularz</button>
<br><br>
<div id="odliczanie"></div>
<script>
let dataDocelowa = new Date("2027-06-08T00:00:00").getTime();
let x = setInterval(function() {
  let teraz = new Date().getTime();
  let odleglosc = dataDocelowa - teraz;
  let dni = Math.floor(odleglosc / (1000 * 60 * 60 * 24));
  let godziny = Math.floor((odleglosc % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  let minuty = Math.floor((odleglosc % (1000 * 60 * 60)) / (1000 * 60));
  let sekundy = Math.floor((odleglosc % (1000 * 60)) / 1000);
  document.getElementById("odliczanie").innerHTML = dni + "d " + godziny + "h " + minuty + "m " + sekundy + "s ";
  if (odleglosc < 0) {
    clearInterval(x);
    document.getElementById("odliczanie").innerHTML = "Zakończone!";
  }
}, 1000);
</script>
</div>
